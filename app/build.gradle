tasks.register('dexAbrpDirectHook', Exec) {
    dependsOn 'jarAbrpDirectHook', 'jarAbrpDirectHookStub'
    inputs.file(abrpDirectHookJarFile)
    outputs.file(layout.buildDirectory.file('generated/abrpDirectHookAssets/abrp_direct_hook/classes.dex'))
    doFirst {
        File sdk = android.sdkDirectory
        boolean isWindows = System.getProperty('os.name').toLowerCase().contains('win')
        String d8Name = isWindows ? 'd8.bat' : 'd8'
        File buildToolsRoot = new File(sdk, 'build-tools')
        File[] candidates = buildToolsRoot.listFiles({ File f -> new File(f, d8Name).isFile() } as FileFilter)
        if (candidates == null || candidates.length == 0) {
            throw new GradleException("Android SDK build-tools with ${d8Name} were not found under ${buildToolsRoot}")
        }
        Arrays.sort(candidates, { File a, File b -> a.name <=> b.name } as Comparator<File>)
        File d8 = new File(candidates[candidates.length - 1], d8Name)
        File outDir = abrpDirectHookAssetsDir.get().asFile
        if (outDir.exists() && !outDir.deleteDir()) {
            throw new GradleException("Could not clean ABRP direct telemetry hook output directory: ${outDir}")
        }
        outDir.mkdirs()
        File androidJar = new File(sdk, 'platforms/android-35/android.jar')
        File stubJar = abrpDirectHookStubJarFile.get().asFile
        if (!androidJar.isFile() || !stubJar.isFile()) {
            throw new GradleException('Android 35 platform and ABRP compile stubs are required to build the direct telemetry hook')
        }
        if (isWindows) {
            commandLine 'cmd', '/c', d8.absolutePath,
                    '--release', '--min-api', '28',
                    '--lib', androidJar.absolutePath,
                    '--lib', stubJar.absolutePath,
                    '--output', outDir.absolutePath, abrpDirectHookJarFile.get().asFile.absolutePath
        } else {
            commandLine d8.absolutePath,
                    '--release', '--min-api', '28',
                    '--lib', androidJar.absolutePath,
                    '--lib', stubJar.absolutePath,
                    '--output', outDir.absolutePath, abrpDirectHookJarFile.get().asFile.absolutePath
        }
    }
    doLast {
        File dex = new File(abrpDirectHookAssetsDir.get().asFile, 'classes.dex')
        if (!dex.isFile() || dex.length() < 256) {
            throw new GradleException('ABRP direct telemetry hook DEX was not generated')
        }
    }
}



